<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  .pp-input::placeholder { color: #A9C1D8; opacity: 1; }
  @keyframes pp-pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.45;transform:scale(.85)} }
  @keyframes pp-dot { 0%,80%,100%{opacity:.25;transform:translateY(0)} 40%{opacity:1;transform:translateY(-2px)} }
  @keyframes pp-bar { 0%{transform:translateX(-100%)} 100%{transform:translateX(320%)} }
</style>
</helmet>
<div style="width:380px;min-height:280px;background:#1F4E79;border-radius:14px;padding:16px 16px 14px;box-sizing:border-box;font-family:Inter,system-ui,sans-serif;color:#fff;display:flex;flex-direction:column;gap:14px;box-shadow:0 18px 44px rgba(12,32,54,.45);border:1px solid rgba(255,255,255,.06)">

  <div style="display:flex;align-items:center;justify-content:space-between">
    <div style="display:flex;align-items:center;gap:8px">
      <div style="width:24px;height:24px;border-radius:7px;background:linear-gradient(150deg,#3B86C9,#12314c);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 7px rgba(46,117,182,.4),inset 0 1px 0 rgba(255,255,255,.16)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9.1" stroke="#CFE4F6" stroke-width="1.3" stroke-dasharray="43 12" stroke-linecap="round" transform="rotate(-58 12 12)"></circle><path d="M9 7 H12.2 A3.1 3.1 0 0 1 12.2 13.2 H9" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"></path><path d="M9 7 V16.1 C9 18.1 10.9 18.7 12 17.3" stroke="#fff" stroke-width="1.9" stroke-linecap="round"></path><circle cx="10.6" cy="10.1" r="1.4" fill="#5FE39B"></circle></svg></div>
      <span style="font-size:16px;font-weight:700;letter-spacing:-.015em">PhishPipeline</span>
    </div>
    <div style="display:flex;align-items:center;gap:5px;font-size:11px;font-weight:500;color:#9AE6B4">
      <span style="width:7px;height:7px;border-radius:50%;background:#34D07A;box-shadow:0 0 7px #34D07A;animation:pp-pulse 1.8s ease-in-out infinite"></span>Live
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:9px">
    <input class="pp-input" type="text" value="{{ url }}" placeholder="Enter URL or paste link..." style="width:100%;box-sizing:border-box;background:#24527A;border:1px solid #35659A;border-radius:9px;padding:10px 12px;color:#fff;font-size:12.5px;font-family:inherit;outline:none" />
    <div style="display:flex;gap:8px">
      <button style="flex:1;background:transparent;border:1px solid #4E7BA6;color:#fff;border-radius:9px;padding:9px 8px;font-size:12px;font-weight:500;font-family:inherit;cursor:pointer" style-hover="background:rgba(255,255,255,.07)">Check Current Tab</button>
      <button onClick="{{ onScanClick }}" style="flex:1;background:#C00000;border:none;color:#fff;border-radius:9px;padding:9px 8px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 2px 10px rgba(192,0,0,.4)" style-hover="background:#d21212">Scan Now</button>
    </div>
  </div>

  <sc-if value="{{ isPhishing }}" hint-placeholder-val="{{ true }}">
    <div style="border-left:4px solid #C00000;background:#FEF2F2;border-radius:9px;padding:13px 14px;display:flex;flex-direction:column;gap:11px">
      <div style="color:#C00000;font-weight:700;font-size:15px;letter-spacing:-.01em">⚠ Phishing Detected</div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="display:flex;justify-content:space-between;font-size:11px;color:#8A2B2B;font-weight:500"><span>Confidence</span><span>{{ confidence }}%</span></div>
        <div style="height:6px;width:100%;background:#F4D4D4;border-radius:3px;overflow:hidden"><div style="height:100%;background:#C00000;border-radius:3px;width:{{ confidence }}%"></div></div>
      </div>
      <div style="font-size:11px;color:#94908F">Attack type: JS Obfuscation</div>
      <button style="align-self:flex-start;background:transparent;border:1px solid #C00000;color:#C00000;border-radius:7px;padding:6px 13px;font-size:11px;font-weight:600;font-family:inherit;cursor:pointer" style-hover="background:#C00000;color:#fff">Report confirmed</button>
    </div>
  </sc-if>

  <sc-if value="{{ isClean }}">
    <div style="border-left:4px solid #006400;background:#F0FAF2;border-radius:9px;padding:13px 14px;display:flex;flex-direction:column;gap:11px">
      <div style="color:#006400;font-weight:700;font-size:15px;letter-spacing:-.01em">✓ Clean</div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="display:flex;justify-content:space-between;font-size:11px;color:#245A34;font-weight:500"><span>Confidence</span><span>{{ confidence }}%</span></div>
        <div style="height:6px;width:100%;background:#CFE9D6;border-radius:3px;overflow:hidden"><div style="height:100%;background:#006400;border-radius:3px;width:{{ confidence }}%"></div></div>
      </div>
      <div style="font-size:11px;color:#8A9490">No threats detected · safe to proceed</div>
    </div>
  </sc-if>

  <sc-if value="{{ isPending }}">
    <div style="border-left:4px solid #9AA7B4;background:#EEF1F4;border-radius:9px;padding:13px 14px;display:flex;flex-direction:column;gap:11px">
      <div style="color:#5B6672;font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px">
        Classifying
        <span style="display:inline-flex;gap:3px">
          <span style="width:4px;height:4px;border-radius:50%;background:#5B6672;animation:pp-dot 1.2s ease-in-out infinite"></span>
          <span style="width:4px;height:4px;border-radius:50%;background:#5B6672;animation:pp-dot 1.2s ease-in-out .2s infinite"></span>
          <span style="width:4px;height:4px;border-radius:50%;background:#5B6672;animation:pp-dot 1.2s ease-in-out .4s infinite"></span>
        </span>
      </div>
      <div style="height:6px;width:100%;background:#DCE2E8;border-radius:3px;overflow:hidden"><div style="height:100%;width:35%;background:#9AA7B4;border-radius:3px;animation:pp-bar 1.1s ease-in-out infinite"></div></div>
      <div style="font-size:11px;color:#9AA2AB">Running Stage 1 heuristics…</div>
    </div>
  </sc-if>

  <div style="margin-top:auto;text-align:center;font-size:10px;color:#8FA8C2;padding-top:2px">{{ footerText }}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 412, &quot;height&quot;: 440 },
  &quot;variant&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;idle&quot;, &quot;pending&quot;, &quot;phishing&quot;, &quot;clean&quot;], &quot;default&quot;: &quot;phishing&quot;, &quot;tsType&quot;: &quot;'idle' | 'pending' | 'phishing' | 'clean'&quot; },
  &quot;url&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;http://secure-login.appleid.verify-account.com&quot;, &quot;tsType&quot;: &quot;string&quot; },
  &quot;confidence&quot;: { &quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 92, &quot;min&quot;: 0, &quot;max&quot;: 100, &quot;unit&quot;: &quot;%&quot;, &quot;tsType&quot;: &quot;number&quot; },
  &quot;interactive&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot; },
  &quot;onScan&quot;: { &quot;editor&quot;: null, &quot;tsType&quot;: &quot;() =&gt; void&quot; }
}">
class Component extends DCLogic {
  renderVals() {
    const v = this.props.variant ?? 'idle';
    const conf = this.props.confidence ?? 0;
    let footer = 'Ready · Stage 1 online';
    if (v === 'pending') footer = 'Classifying · Stage 1';
    else if (v === 'phishing' || v === 'clean') footer = 'Classified by Stage 1 · 0.3s';
    const inert = () => {};
    return {
      url: this.props.url ?? '',
      confidence: conf,
      isPhishing: v === 'phishing',
      isClean: v === 'clean',
      isPending: v === 'pending',
      footerText: footer,
      onScanClick: (this.props.interactive && this.props.onScan) ? this.props.onScan : inert,
    };
  }
}
</script>
</body>
</html>
