[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# No startCommand here on purpose: Railway runs startCommand directly
# (not through a shell), so "$PORT" would be passed to uvicorn as a
# literal string instead of being expanded, causing
# "Invalid value for '--port': '$PORT' is not a valid integer."
# The Dockerfile's CMD uses shell form and expands ${PORT:-8000} correctly,
# so we let Railway fall back to that instead.
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
